name: Release

# Ausgeloest von einem Tag v*, z. B.:
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# Auch hier erst pruefen, dann bauen, dann veroeffentlichen. Eine Version,
# deren Tests nicht gelaufen sind, waere eine Zusage ohne Deckung.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v0.1.0 (nur fuer den Probelauf)'
        required: true

permissions:
  contents: write      # fuer die Release-Notiz
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sprache: [de, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fastapi==0.115.6 pydantic==2.10.4 \
            python-multipart==0.0.20 "PyJWT[crypto]==2.10.1" qrcode==8.0 \
            pytest==8.3.4 httpx==0.28.1
      - env:
          SPRACHE: ${{ matrix.sprache }}
          ZUGANG_TOKEN: testtoken-ohne-belang-aaaaaa
          VERWALTUNG_TOKEN: testtoken-ohne-belang-bbbbbb
        run: python -m pytest tests -q

  abbilder:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wa-gehilfe
            context: .
          - name: wa-gehilfe-koppler
            context: ./koppler
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF#refs/tags/}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Kein :latest hier -- das setzt die CI auf main. Ein Tag beschreibt
          # einen festen Stand; ihn zusaetzlich auf latest zu legen hiesse,
          # zwei Aussagen mit einem Schub zu aendern.
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          cache-from: type=registry,ref=${{ steps.v.outputs.image }}:buildcache

  veroeffentlichen:
    needs: abbilder
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # fuer die Liste der Aenderungen seit dem Vortag

      - name: Release-Notiz schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          V="${GITHUB_REF#refs/tags/}"
          VORHER="$(git describe --tags --abbrev=0 "${V}^" 2>/dev/null || true)"
          if [ -n "$VORHER" ]; then
            UMFANG="${VORHER}..${V}"
            KOPF="Aenderungen seit ${VORHER}:"
          else
            UMFANG="$V"
            KOPF="Erste Fassung. Enthalten:"
          fi

          {
            echo "$KOPF"
            echo
            git log --no-merges --format='- %s' "$UMFANG"
            echo
            echo "## Abbilder"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wa-gehilfe:${V}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/wa-gehilfe-koppler:${V}"
            echo '```'
            echo
            echo "## Betrieb"
            echo
            echo 'Siehe README. Kurz: `cp .env.beispiel .env`, Werte setzen,'
            echo '`docker compose up -d`. Sprache ueber `SPRACHE=de|en`.'
            echo
            echo "Lizenz: AGPL-3.0."
          } > notiz.md

          gh release create "$V" --title "$V" --notes-file notiz.md
